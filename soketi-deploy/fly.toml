# fly.toml file for Soketi deployment on Fly.io
app = "ipl-auction-soketi"
primary_region = "bom" # Mumbai, India (Lowest latency for +05:30 timezone)

[build]
  image = "quay.io/soketi/soketi:1.6-16-alpine"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false # Keep it running so connections are always active
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[env]
  SOKETI_PORT = "8080"
  SOKETI_DEBUG = "true"
  SOKETI_DEFAULT_APP_ID = "ipl-auction-app"
  SOKETI_DEFAULT_APP_KEY = "ipl-auction-key"
  SOKETI_DEFAULT_APP_SECRET = "ipl-auction-secret"
  SOKETI_MAX_MESSAGE_SIZE = "10485760" # 10MB (compared to Pusher's 10KB)
